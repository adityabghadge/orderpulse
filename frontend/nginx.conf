# The API is reachable as "api:8000" both in Docker Compose and in Kubernetes (Service name).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # API calls go to the FastAPI service; the browser only ever talks to this one origin.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://api:8000;
    }

    # Built files have content hashes in their names, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths (like /orders/OP-100123) load index.html and the router
    # takes over in the browser.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
