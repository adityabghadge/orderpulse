# Apply everything with: kubectl apply -k infra/k8s
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: orderpulse
labels:
  - pairs:
      app.kubernetes.io/part-of: orderpulse
resources:
  - namespace.yaml
  - config.yaml
  - postgres.yaml
  - redis.yaml
  - models-volume.yaml
  - api.yaml
  - web.yaml
# Images are built locally (`make k8s-build`). A fixed tag plus IfNotPresent means the cluster
# uses the local image instead of trying to download it from a registry.
images:
  - name: orderpulse-api
    newName: orderpulse-api
    newTag: "0.1.0"
  - name: orderpulse-web
    newName: orderpulse-web
    newTag: "0.1.0"
