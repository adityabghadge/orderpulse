apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0  # never drop below full capacity during a deploy
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      initContainers:
        # Bring the schema up to date before the API starts. Safe with several replicas:
        # migrations take a Postgres advisory lock, so pods apply them one at a time.
        - name: migrate
          image: orderpulse-api
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef: { name: orderpulse-config }
            - secretRef: { name: orderpulse-secrets }
      containers:
        - name: api
          image: orderpulse-api
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef: { name: orderpulse-config }
            - secretRef: { name: orderpulse-secrets }
          # Loading PyTorch takes a few seconds; don't judge health until the app is up.
          startupProbe:
            httpGet: { path: /health/live, port: 8000 }
            periodSeconds: 2
            failureThreshold: 30
          # Restart the container only if the process itself stops answering.
          livenessProbe:
            httpGet: { path: /health/live, port: 8000 }
            periodSeconds: 10
            failureThreshold: 3
          # Send traffic only to pods whose database connection works.
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 2
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - name: models
              mountPath: /app/artifacts
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: models
