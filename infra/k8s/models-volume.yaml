# Trained models, written by the demo-data job and read by every API pod.
# On a single-node local cluster a ReadWriteOnce volume can be shared by pods on that node;
# a multi-node cluster would use ReadWriteMany storage (e.g. EFS) or an object store like S3.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
