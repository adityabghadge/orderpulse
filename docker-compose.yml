name: orderpulse

# `docker compose up` starts only Postgres and Redis (for local development).
# `docker compose --profile app up --build` also runs the API and dashboard in containers.

x-backend: &backend
  image: orderpulse-api:local
  build: ./backend
  environment:
    ORDERPULSE_ENVIRONMENT: docker
    ORDERPULSE_DATABASE_URL: postgresql+psycopg://orderpulse:orderpulse@postgres:5432/orderpulse
    ORDERPULSE_REDIS_URL: redis://redis:6379/0
    ORDERPULSE_CORS_ORIGINS: '["http://localhost:8080"]'
  volumes:
    - models:/app/artifacts

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orderpulse
      POSTGRES_PASSWORD: orderpulse
      POSTGRES_DB: orderpulse
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orderpulse -d orderpulse"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    profiles: [app]
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    profiles: [app]
    ports:
      - "8001:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    image: orderpulse-web:local
    build: ./frontend
    profiles: [app]
    ports:
      - "8080:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  models:
